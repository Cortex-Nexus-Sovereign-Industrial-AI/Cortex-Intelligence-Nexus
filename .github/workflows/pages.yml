name: Build and Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/giftvault
          cp index.html member-dashboard.html styles.css dist/
          cp giftvault/index.html dist/giftvault/index.html
          test -s dist/index.html
          test -s dist/member-dashboard.html
          test -s dist/styles.css
          test -s dist/giftvault/index.html
          grep -q "GiftVault" dist/giftvault/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
